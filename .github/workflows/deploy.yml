name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets the site be rebuilt from the Actions tab without a commit.
  workflow_dispatch:

# Allow one deploy at a time, and let a newer push finish rather than
# queueing behind one already running.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check types, lint and tests
        run: |
          npx tsc -b
          npm run lint
          npm test

      - name: Build
        env:
          # Derived from the repository name so renaming the repo cannot break
          # every asset path on the deployed site.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Vite inlines VITE_* at build time, and this build runs here rather
          # than on anyone's machine — so without this, the published site has
          # no film lookup at all no matter what sits in a local .env. Add it
          # under Settings → Secrets and variables → Actions. Absent, film
          # search simply does not appear; nothing else breaks.
          VITE_TMDB_KEY: ${{ secrets.VITE_TMDB_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
